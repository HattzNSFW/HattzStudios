name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: SQL/TS parity artifacts reproducibility
        run: node infrastructure/supabase/validation/parity/build_parity.mjs --verify

      - name: Test
        run: npm run test

      - name: Control read-only static audit (B4.2)
        run: npm run test -- tests/control/read-only-audit.test.ts

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Build
        run: npm run build
